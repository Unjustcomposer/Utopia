services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: utopia
      POSTGRES_PASSWORD: utopia_dev
      POSTGRES_DB: utopia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "utopia", "-d", "utopia"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8765:8765"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://utopia:utopia_dev@db:5432/utopia
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-dev}
      UTOPIA_DEV_MODE: ${UTOPIA_DEV_MODE:-true}
      JWT_SECRET: ${JWT_SECRET:-dev_secret}
      CORS_ORIGINS: http://localhost:8765,http://localhost:5173
      FRED_API_KEY: ${FRED_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8765/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./data:/app/data

  dashboard:
    profiles:
      - dashboard
    build: .
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    environment:
      UTOPIA_API_URL: http://api:8765
    command: python -m streamlit run app.py

volumes:
  pgdata:
