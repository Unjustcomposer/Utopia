version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: utopia
      POSTGRES_PASSWORD: utopia_dev
      POSTGRES_DB: utopia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8765:8765"
    depends_on:
      - db
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://utopia:utopia_dev@db:5432/utopia
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - UTOPIA_DEV_MODE=${UTOPIA_DEV_MODE:-false}
      - JWT_SECRET=${JWT_SECRET}
      # For local dev without docker: DATABASE_URL=sqlite:///./utopia.db

  dashboard:
    build: .
    profiles:
      - dashboard
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - .:/app
    environment:
      - UTOPIA_API_URL=http://api:8765
    command: ["python", "-m", "streamlit", "run", "app.py"]

volumes:
  pgdata:
