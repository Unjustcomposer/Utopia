apiVersion: apps/v1
kind: Deployment
metadata:
  name: utopia-server
  labels:
    app: utopia
spec:
  replicas: 3
  selector:
    matchLabels:
      app: utopia
  template:
    metadata:
      labels:
        app: utopia
    spec:
      containers:
      - name: utopia-server
        image: utopia-server:latest
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: utopia-service
spec:
  selector:
    app: utopia
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
