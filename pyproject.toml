[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "utopia"
version = "0.1.0"
description = "Differentiable Macroeconomic Simulation Engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "jax>=0.4.13",
    "jaxlib>=0.4.13",
    "flax>=0.7.0",
    "optax>=0.1.5",
    "optuna>=3.2.0",
    "SALib>=1.4.7",
    "scikit-learn>=1.3.0",
    "loguru",
    "PyJWT",
    "sqlalchemy",
    "python-multipart",
    "slowapi",
    "pandas",
    "streamlit",
    "fpdf2",
    "matplotlib",
    "prometheus-client==0.25.0",
    "psycopg2-binary",
    "requests",
    "mlflow"
]

[project.scripts]
utopia = "main:main"

[tool.setuptools]
packages = ["utopia", "utopia.core", "utopia.connectors", "utopia.enterprise"]
py-modules = ["main", "train_rl", "app", "server", "backtest_historical", "dashboard_ui", "us_calibration", "explanation_templates", "utopia_sdk"]
