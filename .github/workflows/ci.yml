name: Utopia CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AUTH0_DOMAIN: dev
      JWT_SECRET: testsecret
      UTOPIA_DEV_MODE: "true"
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .
    - name: Run Unit Tests
      run: |
        alembic upgrade head
        pytest tests/ -v --cov=. -m "not integration and not regression"
    - name: Run Integration Tests
      run: |
        pytest tests/test_cli_integration.py -v -m integration --timeout=300
    - name: Run Scientific Regression Tests
      run: |
        pytest tests/test_regression.py -v -m regression
      env:
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
